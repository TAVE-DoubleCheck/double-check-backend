plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.tave'
version = '0.1.0'

// JDK 17 이상이면 빌드 가능 (바이트코드는 17 기준)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

// Docker Engine 29부터 구형 Docker API(v1.32) 호출을 400으로 거부한다.
// Spring Boot 3.5.6이 관리하는 Testcontainers 1.21.3은 v1.32로 호출해
// "Could not find a valid Docker environment"로 실패 → Engine 29를 지원하는 1.21.4로 올린다.
ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'       // 상품 API + RestClient(적재)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'      // 적재 Writer·ClockService (팀 기준: 적재만 JdbcTemplate)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'  // 도메인 조회 (팀 기준: 도메인은 JPA)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
